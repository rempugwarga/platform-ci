name: Security Scan (reusable)

# Paket pemindaian keamanan standar: secret scanning, audit dependensi,
# dan misconfiguration scan IaC. Secret TIDAK PERNAH disimpan di repository —
# workflow ini membantu menegakkannya.

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      run-gitleaks:
        type: boolean
        default: true
      run-dependency-audit:
        type: boolean
        default: true
      run-iac-scan:
        type: boolean
        default: false
      iac-directory:
        type: string
        default: terraform

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    if: inputs.run-gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks OSS)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks git --redact --no-banner --exit-code 1

  dependencies:
    name: Dependency audit
    if: inputs.run-dependency-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Audit (blokir kritikal)
        run: bun audit --audit-level=critical
      - name: Audit (laporan penuh, tidak memblokir)
        run: bun audit || true

  iac:
    name: IaC misconfiguration scan
    if: inputs.run-iac-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy config scan
        run: |
          docker run --rm -v "$PWD":/src aquasec/trivy:latest \
            config --severity HIGH,CRITICAL --exit-code 1 "/src/${{ inputs.iac-directory }}"
